<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RanzXiter Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url('https://images.unsplash.com/photo-1518770660439-4636190af475') center/cover;
}

.login-box{
width:350px;
padding:30px;
border-radius:25px;
background:rgba(0,0,0,0.35);
backdrop-filter:blur(15px);
border:1px solid rgba(0,150,255,0.3);
box-shadow:0 0 20px rgba(0,150,255,0.4);
}

h1{
text-align:center;
color:#4db8ff;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
border:1px solid rgba(255,255,255,0.2);
background:rgba(255,255,255,0.05);
color:white;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
background:linear-gradient(90deg,#ffffff,#42a5ff);
cursor:pointer;
margin-top:15px;
}

a{
display:block;
text-align:center;
margin-top:15px;
color:#4db8ff;
}
</style>
</head>

<body>

<div class="login-box">
<h1>RanXiter Panel ✓</h1>

<input type="text" placeholder="Masukkan username">
<input type="password" placeholder="Masukkan password">

<button>MASUK</button>

<a href="#">Lupa Password?</a>
<a href="#">Daftar di sini</a>
</div>

</body>
</html>
