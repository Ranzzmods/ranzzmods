<h2>⚡ RANZXITER KEY GENERATOR ⚡</h2>

<select id="hari">
<option value="1">1 Hari</option>
<option value="3">3 Hari</option>
<option value="7">7 Hari</option>
<option value="15">15 Hari</option>
<option value="21">21 Hari</option>
<option value="30">30 Hari</option>
</select>

<button onclick="generateKey()">🔑 Generate Key</button>

<div style="margin-top:15px">
<p><b>KEY:</b> <span id="key">-</span></p>
<p><b>STATUS:</b> <span id="status">🟢 Active</span></p>
<p><b>EXPIRED:</b> <span id="expired">-</span></p>
</div>

<h3>📜 Riwayat Key</h3>
<div id="history"></div>

<script>
function generateKey(){

const hari = parseInt(document.getElementById("hari").value);

const angka = Math.floor(10000 + Math.random() * 90000);
const key = "RH-" + angka;

const tanggal = new Date();
tanggal.setDate(tanggal.getDate() + hari);

const expired = tanggal.toLocaleDateString("id-ID");

document.getElementById("key").textContent = key;
document.getElementById("expired").textContent = expired;

const item = document.createElement("div");
item.innerHTML = `
<b>${key}</b> | ${expired} | 🟢 Active
<button onclick="this.parentElement.remove()">❌ Hapus</button>
`;
item.style.margin = "5px 0";

document.getElementById("history").prepend(item);
}
</script>
